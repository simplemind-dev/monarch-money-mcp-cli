name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Core CLI installs with zero dependencies
        run: |
          python -m pip install .
          python -c "import importlib.metadata as m; r = m.requires('monarch-money-mcp-cli') or []; bad = [x for x in r if 'extra ==' not in x]; assert not bad, bad"
          monarch --version
      - name: Tests
        run: |
          python -m pip install '.[mcp]'
          python -m unittest discover -s tests -v
